name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: custodiam
          POSTGRES_PASSWORD: test
          POSTGRES_DB: custodiam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to exact version: astral-sh/setup-uv does NOT publish a
        # `@v8` major alias (unlike `@v6` checkout or `@v7` build-push-action).
        # Tags are full semver only (v8.1.0, v8.0.0), so we pin explicitly.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies (including dev)
        run: uv sync --all-extras --frozen

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Test with pytest
        env:
          DATABASE_URL: postgresql+psycopg://custodiam:test@localhost:5432/custodiam_test
        run: uv run pytest tests/ -v --cov=app

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
