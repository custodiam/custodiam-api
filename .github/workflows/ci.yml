name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Disparar tests también en PRs hacia `develop` para que un fallo
    # como el del PR #16 (TEST_DATABASE_URL desalineado) se detecte
    # antes del merge en lugar de dejar `develop` en rojo. El job
    # `build-docker` sigue protegido por su propio `if:` y solo
    # publica imagen en push directo a `main`.
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: custodiam
          POSTGRES_PASSWORD: test
          POSTGRES_DB: custodiam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # Pinned to exact version: astral-sh/setup-uv does NOT publish a
        # `@v8` major alias (unlike `@v6` checkout or `@v7` build-push-action).
        # Tags are full semver only (v8.1.0, v8.0.0), so we pin explicitly.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies (including dev)
        run: uv sync --all-extras --frozen

      - name: Smoke test Alembic migrations (round-trip)
        # EN-08-38: ejecuta las migraciones contra el service container
        # Postgres para atrapar bugs que solo se manifiestan en runtime
        # (p. ej. `sa.text("gen_random_uuid()")` en `op.bulk_insert(...)`
        # con psycopg3, detectado en producción local el 26-may-2026).
        # Verifica: (1) `upgrade head` aplica todas desde BD vacía;
        # (2) `downgrade -1` revierte la última simétricamente;
        # (3) `upgrade head` vuelve a aplicar tras revert (idempotencia).
        env:
          DATABASE_URL: postgresql+psycopg://custodiam:test@localhost:5432/custodiam_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Lint with ruff
        run: uv run ruff check app/ tests/

      - name: Test with pytest
        env:
          # `DATABASE_URL` lo lee `app.core.config.settings` cuando la
          # app arranca; `TEST_DATABASE_URL` lo lee el conftest. Ambas
          # apuntan al mismo service container del workflow porque en
          # CI no hay BD de producción separada.
          DATABASE_URL: postgresql+psycopg://custodiam:test@localhost:5432/custodiam_test
          TEST_DATABASE_URL: postgresql+psycopg://custodiam:test@localhost:5432/custodiam_test
        run: uv run pytest tests/ -v --cov=app

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
